; Bench harness for firmware/src/servo_driver.cpp
;
; Compiles the REAL driver source out of ../firmware, deliberately. A copy would
; drift from what ships and the test would stop meaning anything.
;
; Board settings mirror firmware/platformio.ini exactly — the S3FH4R2 boot-loops
; if the 8 MB default partition table is used.

[env:drivertest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
board_upload.wait_for_upload_port = true
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -I../firmware/include
build_src_filter =
  +<*>
  +<../../firmware/src/servo_driver.cpp>
