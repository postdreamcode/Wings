; Wings pad/pulse probe — standalone, separate from firmware/
; Same board + core as firmware (espressif32 7.0.1 -> framework 3.20017 = Arduino 2.0.17)
; so the measurements apply to the real build.

[env:padtest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
board_upload.wait_for_upload_port = true
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
