name: wings_app
description: Wings ESP32 BLE controller — sideload APK
publish_to: "none"
version: 1.1.37+39

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.4.0
  sherpa_onnx: ^1.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sherpa/encoder.int8.onnx
    - assets/sherpa/decoder.int8.onnx
    - assets/sherpa/joiner.int8.onnx
    - assets/sherpa/tokens.txt
    - assets/sherpa/keywords.txt
    - assets/sherpa/campplus.onnx
