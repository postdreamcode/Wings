; Wings ESP32-S3 — one binary, role via GPIO7
; Board: ESP32-S3 Mini (ESP32-S3FH4R2) 4MB flash + 2MB PSRAM

[env:esp32-s3-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
board_upload.wait_for_upload_port = true
; Force 4MB flash + 4MB partition table.
; esp32-s3-devkitc-1 defaults to 8MB flash + default_8MB.csv → instant boot-loop on FH4R2.
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  sui77/rc-switch @ ^2.6.4
  h2zero/NimBLE-Arduino @ ^1.4.3
